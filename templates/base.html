{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SIKKA{% endblock %}</title>

    <!-- SEO Meta Description -->
    <meta name="description" content="{% block meta_description %}SIKKA — a blockchain-powered digital rewards platform featuring secure wallets, peer-to-peer transactions, mining rewards and a transparent blockchain explorer.{% endblock %}">
    <meta name="keywords" content="SIKKA, blockchain, digital wallet, cryptocurrency, mining, transactions, Django">
    <meta name="author" content="SIKKA Team">

    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}SIKKA | Blockchain Platform{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Secure wallets, peer-to-peer transfers, mining rewards and blockchain explorer — all in one platform.{% endblock %}">
    <meta property="og:type" content="website">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% block content %}{% endblock %}

    {% include 'partials/cookie_banner.html' %}

    <!-- Scroll to Top Button -->
    <button id="scroll-top-btn" title="Back to top" aria-label="Scroll to top">
        <i class="bi bi-chevron-up"></i>
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Landing JS -->
    <script src="{% static 'js/landing.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
