{% extends "dashboard/base.html" %}
{% load static %}

{% block title %}My Rewards{% endblock %}
{% block page_title %}My Achievements & Rewards{% endblock %}

{% block main_content %}

<div id="loading-spinner" class="text-center p-5">
    <div class="spinner-border text-gold" role="status"></div>
    <p class="mt-3 text-muted">Loading your rewards...</p>
</div>

<div id="rewards-content" style="display:none;">
    <!-- Rewards List -->
    <div class="dash-card">
        <h5 class="mb-4">My Rewards History</h5>
        <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Organisation</th>
                        <th>Achievement</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="rewards-tbody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const token = sessionStorage.getItem("sikka_access");
    if(!token) {
        window.location.href = "/accounts/login/";
        return;
    }

    // Load rewards info
    fetch("/api/v1/rewards/student/", {
        method: "GET",
        headers: { "Authorization": "Bearer " + token }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("loading-spinner").style.display = "none";
        document.getElementById("rewards-content").style.display = "block";

        const tbody = document.getElementById("rewards-tbody");
        if(data.rewards && data.rewards.length > 0) {
            data.rewards.forEach(r => {
                const tr = document.createElement("tr");
                let statusBadgeClass = 'bg-secondary';
                
                if (r.status === 'PENDING') {
                    statusBadgeClass = 'bg-warning text-dark';
                } else if (r.status === 'APPROVED') {
                    statusBadgeClass = 'bg-success';
                } else if (r.status === 'REJECTED') {
                    statusBadgeClass = 'bg-danger';
                }
                
                const dateObj = new Date(r.issued_at);
                const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${r.organisation_name}</td>
                    <td>${r.achievement_type}</td>
                    <td>${r.description}</td>
                    <td class="text-success">+${r.amount} SKA</td>
                    <td><span class="badge ${statusBadgeClass}">${r.status}</span></td>
                `;
                tbody.appendChild(tr);
            });

        } else {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5"><i class="bi bi-stars fs-1 d-block mb-3 text-gold"></i><h5>No Rewards Yet</h5><p>You haven't earned any university rewards yet. Participate in hackathons, events, and keep up your attendance to earn SKA tokens!</p></td></tr>`;
        }
    })
    .catch(err => {
        console.error(err);
        document.getElementById("loading-spinner").style.display = "none";
    });
});
</script>

{% endblock %}
