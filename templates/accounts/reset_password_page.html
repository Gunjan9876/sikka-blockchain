<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — SIKKA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f0f; font-family: 'Segoe UI', Arial, sans-serif; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 48px 40px; max-width: 440px; width: 90%; text-align: center; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #f0b90b; margin-bottom: 32px; }
    .logo span { color: #fff; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 24px; }
    input { width: 100%; padding: 12px 16px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #f0b90b; }
    .btn { width: 100%; padding: 13px; background: #f0b90b; color: #000; font-weight: 700; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 16px; min-height: 20px; }
    .msg.success { color: #4caf50; }
    .msg.error   { color: #e53935; }
    #form-section, #done-section { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SKA<span>KKA</span></div>

    <div id="form-section">
      <h1>Choose a new password</h1>
      <p>Must be at least 8 characters with uppercase, lowercase, number, and symbol.</p>
      <input type="password" id="password"  placeholder="New password"/>
      <input type="password" id="password2" placeholder="Confirm new password"/>
      <button class="btn" id="submit-btn" onclick="submitReset()">Reset Password</button>
      <div class="msg" id="msg"></div>
    </div>

    <div id="done-section">
      <div class="icon">✅</div>
      <h1>Password updated!</h1>
      <p>Your password has been changed. You can now log in with your new password.</p>
      <a href="/accounts/login/" style="display:inline-block; margin-top:8px; padding:12px 28px; background:#f0b90b; color:#000; font-weight:700; border-radius:8px; text-decoration:none;">Go to Login</a>
    </div>
  </div>

  <script>
    const token = "{{ token }}";
    document.getElementById("form-section").style.display = "block";

    function submitReset() {
      const pw  = document.getElementById("password").value;
      const pw2 = document.getElementById("password2").value;
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit-btn");

      if (pw !== pw2) {
        msg.textContent = "Passwords do not match.";
        msg.className = "msg error";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting…";
      msg.textContent = "";

      fetch("/api/v1/accounts/password-reset/confirm/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: pw, confirm_password: pw2 }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.message) {
            document.getElementById("form-section").style.display = "none";
            document.getElementById("done-section").style.display  = "block";
          } else {
            msg.textContent = data.error || Object.values(data)[0];
            msg.className = "msg error";
            btn.disabled = false;
            btn.textContent = "Reset Password";
          }
        })
        .catch(() => {
          msg.textContent = "Network error. Please try again.";
          msg.className = "msg error";
          btn.disabled = false;
          btn.textContent = "Reset Password";
        });
    }
  </script>
</body>
</html>
