<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — SIKKA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f0f; font-family: 'Segoe UI', Arial, sans-serif; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 48px 40px; max-width: 440px; width: 90%; text-align: center; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #f0b90b; margin-bottom: 32px; }
    .logo span { color: #fff; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 24px; }
    input { width: 100%; padding: 12px 16px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #f0b90b; }
    .btn { width: 100%; padding: 13px; background: #f0b90b; color: #000; font-weight: 700; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 16px; min-height: 20px; }
    .msg.success { color: #4caf50; }
    .msg.error   { color: #e53935; }
    .back-link { display: block; margin-top: 20px; font-size: 13px; color: #888; text-decoration: none; }
    .back-link:hover { color: #f0b90b; }
    #done-section { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SIK<span>KA</span></div>

    <div id="form-section">
      <div class="icon">🔑</div>
      <h1>Forgot your password?</h1>
      <p>Enter the email address linked to your account and we'll send you a reset link.</p>
      <input type="email" id="emailInput" placeholder="Enter your email address" autocomplete="email" />
      <button class="btn" id="submitBtn" onclick="sendReset()">Send Reset Link</button>
      <div class="msg" id="msg"></div>
      <a href="/accounts/login/" class="back-link">← Back to login</a>
    </div>

    <div id="done-section">
      <div class="icon">📧</div>
      <h1>Check your inbox</h1>
      <p>If that email is registered, a password reset link has been sent. Check your spam folder too.</p>
      <a href="/accounts/login/" class="back-link">← Back to login</a>
    </div>
  </div>

  <script>
    document.getElementById("form-section").style.display = "block";

    async function sendReset() {
      const email = document.getElementById("emailInput").value.trim();
      const msg   = document.getElementById("msg");
      const btn   = document.getElementById("submitBtn");

      if (!email) {
        msg.className = "msg error";
        msg.textContent = "Please enter your email address.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending…";
      msg.textContent = "";

      try {
        const res = await fetch("/api/v1/accounts/password-reset/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        // Always show success (API doesn't reveal if email exists)
        document.getElementById("form-section").style.display = "none";
        document.getElementById("done-section").style.display  = "block";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Network error. Please try again.";
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
      }
    }

    document.getElementById("emailInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendReset();
    });
  </script>
</body>
</html>
