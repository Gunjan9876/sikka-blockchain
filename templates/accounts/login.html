{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SIKKA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Register CSS (Reused for Login) -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

<div class="background-blur">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

<div class="container">

    <div class="register-card">

        <div class="logo">
            <h2>SIKKA</h2>
            <p>Welcome back to SIKKA</p>
        </div>

        <form id="loginForm" method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username or Email</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="login"
                        name="login"
                        placeholder="Enter username or email"
                        required>
                </div>
            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

            </div>

            <button class="register-btn w-100" type="submit">
                Login
            </button>

        </form>

        <div class="bottom-text">

            Don't have an account?

            <a href="{% url 'register_page' %}">
                Create Account
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("loginForm");
        
        form.addEventListener("submit", async function(event) {
            event.preventDefault(); // Enhance with JS
            
            // Clear any existing error messages
            document.querySelectorAll(".invalid-feedback").forEach(el => el.remove());
            document.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: formData,
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Do NOT store token in localStorage per user instructions.
                    // Token is returned in API response: data.token
                    
                    // Redirect to home page or dashboard on success
                    window.location.href = "/";
                } else {
                    // Display errors
                    if (data.error) {
                        // General error (e.g. Invalid credentials)
                        const loginElement = document.getElementById("login");
                        loginElement.classList.add("is-invalid");
                        
                        const errorDiv = document.createElement("div");
                        errorDiv.className = "invalid-feedback d-block";
                        errorDiv.textContent = data.error;
                        
                        loginElement.parentElement.parentElement.appendChild(errorDiv);
                    } else {
                        // Field-specific errors
                        for (const field in data) {
                            const inputElement = document.getElementById(field);
                            if (inputElement) {
                                inputElement.classList.add("is-invalid");
                                const errorDiv = document.createElement("div");
                                errorDiv.className = "invalid-feedback d-block";
                                
                                if (Array.isArray(data[field])) {
                                    errorDiv.textContent = data[field][0];
                                } else {
                                    errorDiv.textContent = data[field];
                                }
                                
                                inputElement.parentElement.parentElement.appendChild(errorDiv);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error during login:", error);
            }
        });
    });
</script>

</body>
</html>
