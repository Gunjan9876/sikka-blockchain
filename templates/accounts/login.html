{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SIKKA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Register CSS (Reused for Login) -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}?v=2">
</head>

<body>

<div class="background-blur">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

    <div class="register-card">

        <div class="logo">
            <h2>SIKKA</h2>
            <p>Welcome back to SIKKA</p>
        </div>

        <form id="loginForm" method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username or Email</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="login"
                        name="login"
                        placeholder="Enter username or email"
                        required>
                </div>
            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
                    <label class="form-check-label small text-muted" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="{% url 'forgot_password_page' %}" class="small text-decoration-none" style="color: var(--primary-color, #cfa859);">
                    Forgot Password?
                </a>
            </div>

            <button class="register-btn w-100 position-relative" type="submit" id="submitBtn">
                <span id="btnText">Login</span>
                <span class="spinner-border spinner-border-sm d-none position-absolute top-50 start-50 translate-middle" id="btnSpinner" role="status" aria-hidden="true"></span>
            </button>

        </form>

            <div class="mt-3">
                <a href="#" id="resendVerificationLink" class="small text-muted text-decoration-underline" style="display:none;" data-bs-toggle="modal" data-bs-target="#resendVerificationModal">
                    Resend Verification Email
                </a>
            </div>
        </div>
    </div>
    
    <!-- Resend Verification Modal -->
    <div class="modal fade" id="resendVerificationModal" tabindex="-1" aria-labelledby="resendVerificationModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: var(--card-bg, #ffffff); border-radius: 1rem;">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="resendVerificationModalLabel">Resend Verification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pb-4">
            <p class="text-muted small">Enter your email address and we'll send you a new verification link.</p>
            <form id="resendVerificationForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="resendEmail" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="background-color: var(--primary-color, #cfa859); border:none;" id="resendBtn">Send Link</button>
            </form>
            <div id="resendMessage" class="mt-3 small"></div>
          </div>
        </div>
      </div>
    </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("loginForm");
        
        form.addEventListener("submit", async function(event) {
            event.preventDefault(); // Enhance with JS
            
            // Clear any existing error messages
            document.querySelectorAll(".invalid-feedback").forEach(el => el.remove());
            document.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
            
            const formData = new FormData(form);
            
            const submitBtn = document.getElementById("submitBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");
            
            // Loading state
            btnText.classList.add("d-none");
            btnSpinner.classList.remove("d-none");
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(form.action, {
    method: form.method,
    body: JSON.stringify({
        login: formData.get("login"),
        password: formData.get("password")
    }),
    headers: {
        "Content-Type": "application/json",
        "X-Requested-With": "XMLHttpRequest",
        "X-CSRFToken": formData.get("csrfmiddlewaretoken")
    }
});
                const data = await response.json();
                
                if (response.ok) {
                    // Check remember me
                    const rememberMe = document.getElementById("rememberMe").checked;
                    
                    if (data.access) {
                        // Store tokens in the correct location (localStorage if "Remember Me")
                        const store = rememberMe ? localStorage : sessionStorage;
                        store.setItem("sikka_access", data.access);
                        store.setItem("sikka_refresh", data.refresh);
                    }

                    // Route to the correct dashboard based on role returned by the API
                    if (data.is_superuser) {
                        window.location.href = "/admin/";
                    } else if (data.has_org) {
                        window.location.href = "/dashboard/org/";
                    } else {
                        window.location.href = "/dashboard/";
                    }
                } else {
                    // Revert Loading state
                    btnText.classList.remove("d-none");
                    btnSpinner.classList.add("d-none");
                    submitBtn.disabled = false;
                    
                    // Display errors
                    if (data.error) {
                        // General error (e.g. Invalid credentials)
                        const loginElement = document.getElementById("login");
                        loginElement.classList.add("is-invalid");
                        
                        const errorDiv = document.createElement("div");
                        errorDiv.className = "invalid-feedback d-block";
                        errorDiv.textContent = data.error;
                        
                        loginElement.parentElement.parentElement.appendChild(errorDiv);
                    } else {
                        // Field-specific errors
                        for (const field in data) {
                            const inputElement = document.getElementById(field);
                            if (inputElement) {
                                inputElement.classList.add("is-invalid");
                                const errorDiv = document.createElement("div");
                                errorDiv.className = "invalid-feedback d-block";
                                
                                if (Array.isArray(data[field])) {
                                    errorDiv.textContent = data[field][0];
                                } else {
                                    errorDiv.textContent = data[field];
                                }
                                
                                inputElement.parentElement.parentElement.appendChild(errorDiv);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error during login:", error);
                // Revert Loading state
                btnText.classList.remove("d-none");
                btnSpinner.classList.add("d-none");
                submitBtn.disabled = false;
            }
        });
        
        // Show resend link after 5 seconds to help users who might be stuck
        setTimeout(() => {
            document.getElementById("resendVerificationLink").style.display = "inline";
        }, 5000);
        
        // Resend Verification Form Handler
        const resendForm = document.getElementById("resendVerificationForm");
        resendForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("resendEmail").value;
            const msgDiv = document.getElementById("resendMessage");
            const btn = document.getElementById("resendBtn");
            
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;
            btn.disabled = true;
            
            try {
                const res = await fetch("/api/v1/accounts/resend-verification/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    msgDiv.className = "mt-3 small text-success";
                    msgDiv.innerHTML = `<i class="bi bi-check-circle"></i> ${data.message}`;
                } else {
                    msgDiv.className = "mt-3 small text-danger";
                    msgDiv.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${data.error || "Failed to resend."}`;
                }
            } catch (err) {
                msgDiv.className = "mt-3 small text-danger";
                msgDiv.innerHTML = `<i class="bi bi-exclamation-triangle"></i> An error occurred.`;
            } finally {
                btn.innerHTML = "Send Link";
                btn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
