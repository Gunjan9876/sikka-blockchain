{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Registration | SIKKA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Register CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}?v=2">
    
    <style>
        .register-card {
            max-width: 600px;
        }
    </style>
</head>

<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; padding: 2rem 0; overflow-x: hidden; overflow-y: auto; height: auto;">

<div class="background-blur" style="position: fixed;">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

    <div class="register-card" style="margin: 3rem auto;">

        <div class="logo">
            <h2>SIKKA</h2>
            <p>Register as a University</p>
        </div>

        <form id="registerForm" method="POST" action="/api/v1/accounts/university-register/" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">University Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-building"></i></span>
                        <input type="text" class="form-control" id="university_name" name="university_name" placeholder="Enter full university name" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Admin username" required>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Official Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Admin email" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Person</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="contact_person" name="contact_person" placeholder="Name" required>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="text" class="form-control" id="contact_number" name="contact_number" placeholder="Phone number" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Website (Optional)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-globe"></i></span>
                        <input type="url" class="form-control" id="website" name="website" placeholder="https://example.edu">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Physical Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" class="form-control" id="address" name="address" placeholder="Full address" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">University Logo (Optional)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-image"></i></span>
                        <input type="file" class="form-control" id="logo" name="logo" accept="image/*">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="Confirm password" required>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" name="agree_terms" required>
                    <label class="form-check-label small" for="agreeTerms" style="color: #ddd;">
                        I agree to the <a href="{% url 'terms_page' %}" class="text-decoration-none" style="color: #d4af37;">Terms & Conditions</a>, <a href="{% url 'privacy_page' %}" class="text-decoration-none" style="color: #d4af37;">Privacy Policy</a>, and <a href="{% url 'cookies_page' %}" class="text-decoration-none" style="color: #d4af37;">Cookie Policy</a>.
                    </label>
                </div>
            </div>

            <button class="register-btn w-100 position-relative" type="submit" id="submitBtn">
                <span id="btnText">Submit Application</span>
                <span class="spinner-border spinner-border-sm d-none position-absolute top-50 start-50 translate-middle" id="btnSpinner" role="status" aria-hidden="true"></span>
            </button>

        </form>

        <div class="bottom-text">
            Already registered?
            <a href="{% url 'login_page' %}">Login</a>
            <br><br>
            <a href="{% url 'register_page' %}" style="font-size: 0.85rem; color: #aaa;">Register as a Student instead</a>
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("registerForm");
        
        form.addEventListener("submit", async function(event) {
            event.preventDefault(); // Enhance with JS
            
            // Clear any existing error messages
            document.querySelectorAll(".invalid-feedback").forEach(el => el.remove());
            document.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
            
            const formData = new FormData(form);
            
            const submitBtn = document.getElementById("submitBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");
            
            // Loading state
            btnText.classList.add("d-none");
            btnSpinner.classList.remove("d-none");
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: formData,
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Redirect to login page on success
                    window.location.href = "{% url 'login_page' %}";
                } else {
                    // Display errors
                    for (const field in data) {
                        const inputElement = document.getElementById(field);
                        // map confirm_password to confirmPassword ID in HTML
                        const targetElement = field === 'confirm_password' ? document.getElementById('confirmPassword') : inputElement;
                        
                        if (targetElement) {
                            targetElement.classList.add("is-invalid");
                            const errorDiv = document.createElement("div");
                            errorDiv.className = "invalid-feedback d-block";
                            
                            if (Array.isArray(data[field])) {
                                errorDiv.textContent = data[field][0];
                            } else {
                                errorDiv.textContent = data[field];
                            }
                            
                            targetElement.parentElement.parentElement.appendChild(errorDiv);
                        }
                    }
                    
                    // Revert Loading state
                    btnText.classList.remove("d-none");
                    btnSpinner.classList.add("d-none");
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Error during registration:", error);
                // Revert Loading state
                btnText.classList.remove("d-none");
                btnSpinner.classList.add("d-none");
                submitBtn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
