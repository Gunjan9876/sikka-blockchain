<div id="cookieConsentBanner" class="cookie-banner" style="display: none;">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
        <div class="cookie-text mb-3 mb-md-0 me-md-4">
            <strong><i class="bi bi-cookie"></i> We value your privacy</strong>
            <p class="mb-0 small text-muted mt-1">
                We use cookies to enhance your browsing experience, serve personalized content, and analyze our traffic. 
                By clicking "Accept All", you consent to our use of cookies as described in our 
                <a href="/cookies/" class="cookie-link">Cookie Policy</a> and 
                <a href="/privacy/" class="cookie-link">Privacy Policy</a>.
            </p>
        </div>
        <div class="cookie-actions flex-shrink-0 d-flex gap-2">
            <button id="cookieRejectBtn" class="btn btn-sm cookie-btn-outline">Decline</button>
            <button id="cookieAcceptBtn" class="btn btn-sm cookie-btn-primary">Accept All</button>
        </div>
    </div>
</div>

<style>
    .cookie-banner {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 900px;
        background: rgba(15, 15, 20, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 12px;
        padding: 20px 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        z-index: 9999;
        color: #f0f0f0;
        animation: slideUp 0.5s ease forwards;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translate(-50%, 20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
    }

    .cookie-link {
        color: #d4af37;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
    }

    .cookie-link:hover {
        color: #f2cf63;
        text-decoration: underline;
    }

    .cookie-btn-primary {
        background: linear-gradient(90deg, #d4af37, #f2cf63);
        color: #111;
        border: none;
        font-weight: 600;
        padding: 8px 20px;
        border-radius: 8px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .cookie-btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        color: #111;
    }

    .cookie-btn-outline {
        background: transparent;
        color: #aaa;
        border: 1px solid rgba(255,255,255,0.1);
        font-weight: 500;
        padding: 8px 20px;
        border-radius: 8px;
        transition: all 0.2s;
    }

    .cookie-btn-outline:hover {
        background: rgba(255,255,255,0.05);
        color: #fff;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const banner = document.getElementById("cookieConsentBanner");
        const acceptBtn = document.getElementById("cookieAcceptBtn");
        const rejectBtn = document.getElementById("cookieRejectBtn");
        
        // Check if user has already made a choice
        if (!localStorage.getItem("sikka_cookie_consent")) {
            // Show the banner with a slight delay for better UX
            setTimeout(() => {
                banner.style.display = "block";
            }, 500);
        }

        function hideBanner(consent) {
            localStorage.setItem("sikka_cookie_consent", consent);
            banner.style.opacity = "0";
            banner.style.transform = "translate(-50%, 20px)";
            banner.style.transition = "all 0.3s ease";
            setTimeout(() => {
                banner.style.display = "none";
            }, 300);
        }

        acceptBtn.addEventListener("click", () => hideBanner("accepted"));
        rejectBtn.addEventListener("click", () => hideBanner("rejected"));
    });
</script>
